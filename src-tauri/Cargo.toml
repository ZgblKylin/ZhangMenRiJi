[package]
name = "zhangmenriji-desktop"
version = "3.0.0"
description = "《掌门日记》— 武侠门派经营模拟器桌面应用"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zhangmenriji_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
zhangmenriji = { path = "../backend" }

[lints.rust]
# 编译器级别的检查
unsafe_code = "forbid"             # 绝对禁止使用 unsafe
# unused_imports = "warn"
# unused_variables = "allow"         # 允许未使用的变量（开发期常用）

[lints.clippy]
# 1. 开启严格的 pedantic 和 nursery 规则组
# 注意：priority = -1 表示这些组的优先级较低，允许后面的具体规则覆盖它们
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# 2. 开启 cargo 检查（检查依赖版本、特性等）
cargo = { level = "warn", priority = -1 }
# 3. 针对特定规则进行微调（覆盖上面的组配置）
# 禁止使用 unwrap 和 expect（强制错误处理）
unwrap_used = "deny"
expect_used = "deny"
# 放行一些 pedantic 中过于严苛或不符合团队习惯的规则
# module_name_repetitions = "allow"  # 允许模块名和结构体名重复
# missing_errors_doc = "allow"       # 不强制要求为返回 Result 的函数写文档
# missing_panics_doc = "allow"       # 不强制要求为可能 panic 的函数写文档
# too_many_lines = "allow"           # 不限制函数行数

[package]
name = "zhangmenriji"
version = "3.1.0"
edition = "2021"
description = "《掌门日记》v3 — 武侠门派经营模拟器后端"

[lib]
name = "zhangmenriji"
path = "src/lib.rs"

[[bin]]
name = "zhangmenriji"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
rand = "0.8"
rayon = "1.10"
dirs = "6"

[lints.rust]
# 编译器级别的检查
unsafe_code = "forbid"             # 绝对禁止使用 unsafe
# unused_imports = "warn"
# unused_variables = "allow"         # 允许未使用的变量（开发期常用）

[lints.clippy]
# 1. 开启严格的 pedantic 和 nursery 规则组
# 注意：priority = -1 表示这些组的优先级较低，允许后面的具体规则覆盖它们
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# 2. 开启 cargo 检查（检查依赖版本、特性等）
cargo = { level = "warn", priority = -1 }
# 3. 针对特定规则进行微调（覆盖上面的组配置）
# 禁止使用 unwrap 和 expect（强制错误处理）
unwrap_used = "deny"
expect_used = "deny"
# 放行一些 pedantic 中过于严苛或不符合团队习惯的规则
# module_name_repetitions = "allow"  # 允许模块名和结构体名重复
# missing_errors_doc = "allow"       # 不强制要求为返回 Result 的函数写文档
# missing_panics_doc = "allow"       # 不强制要求为可能 panic 的函数写文档
# too_many_lines = "allow"           # 不限制函数行数

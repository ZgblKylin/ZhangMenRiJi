<!--
  ============================================================================
   《掌门日记》—— 武侠门派经营模拟器  v2.0
  ============================================================================

  重构说明：
  - 前后端分离：Rust (axum) 后端 + 纯 HTML/CSS/JS 前端
  - 存储：PostgreSQL 持久化，替代 LocalStorage
  - API：RESTful，核心逻辑移至后端

  技术选型：前端零外部依赖，CSS 武侠宣纸风。
  ============================================================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌门日记 — 武侠门派经营模拟器</title>
<style>
/* ============================================================
   CSS — 武侠宣纸风主题 · 左右书卷布局
   ============================================================ */
:root {
  --paper: #f5e6c8;
  --paper-dark: #e8d5a8;
  --paper-light: #faf3e4;
  --ink: #2c1810;
  --ink-light: #5c3d2e;
  --ink-fade: #8b7355;
  --cinnabar: #c43a31;
  --cinnabar-light: #e05a50;
  --jade: #4a7c59;
  --jade-light: #6ba37a;
  --gold: #b8860b;
  --gold-light: #daa520;
  --border: #c4a87c;
  --shadow: rgba(44, 24, 16, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', sans-serif;
  background: #3c2415;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(139, 115, 85, 0.3) 0%, transparent 60%),
    radial-gradient(ellipse at 20% 80%, rgba(196, 58, 49, 0.05) 0%, transparent 50%);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--ink);
  overflow: hidden;
  padding: 0.8rem;
}

.scroll-container {
  width: 1020px;
  height: 780px;
  background: var(--paper);
  background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  border: 3px solid var(--border);
  border-radius: 3px;
  box-shadow:
    0 2px 20px var(--shadow),
    0 0 0 8px var(--paper-dark),
    0 0 0 11px var(--border),
    0 0 0 12px var(--paper-dark);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform-origin: center center;
}

.scroll-container::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(139, 115, 85, 0.05) 28px, rgba(139, 115, 85, 0.05) 29px);
  pointer-events: none; z-index: 0;
}

/* 透传 #content，让子元素直接参与 .scroll-container 的 flex 布局 */
#content { display: contents; }

.top-bar {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0.4rem 1rem;
  border-bottom: 2px solid var(--border);
  flex-shrink: 0;
  background: linear-gradient(to bottom, rgba(250, 243, 228, 0.6), transparent);
}
.top-bar .title-block { text-align: center; flex: 1; }
.top-bar .title-block h1 { font-family: 'STKaiti', 'KaiTi', cursive; font-size: 1.8rem; color: var(--ink); letter-spacing: 0.25em; margin: 0; }
.top-bar .subtitle { font-size: 0.72rem; color: var(--ink-fade); letter-spacing: 0.2em; }
.top-bar .month-text { font-size: 0.95rem; color: var(--ink-light); letter-spacing: 0.15em; margin-top: 0.15rem; }
.top-bar .month-text strong { color: var(--cinnabar); font-size: 1.1rem; }
.top-bar .injured-tag { color: var(--cinnabar); font-size: 0.7rem; }
.top-bar .nav-btns { display: flex; flex-direction: column; gap: 0.25rem; flex-shrink: 0; }

.book-layout {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 2fr 3fr;
  flex: 3;
  overflow: hidden;
  min-height: 0;
}

.book-layout::after {
  content: '';
  position: absolute; top: 0; bottom: 0; left: 40%;
  width: 2px;
  background: linear-gradient(to bottom, transparent, rgba(196, 58, 49, 0.25), rgba(139, 115, 85, 0.15), rgba(196, 58, 49, 0.25), transparent);
  pointer-events: none; z-index: 2;
}

.left-page, .right-page { overflow-y: auto; overflow-x: hidden; padding: 0.6rem 0.8rem; }
.left-page { padding-right: 1.2rem; }
.right-page { padding-left: 1.2rem; }

/* 底部纪事横栏 */
.chronicles-bar {
  position: relative; z-index: 1;
  border-top: 2px solid var(--border);
  padding: 0.35rem 1rem;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: linear-gradient(to bottom, rgba(250, 243, 228, 0.3), transparent);
}
.chronicles-bar .chronicles-title {
  font-family: 'STKaiti', 'KaiTi', serif;
  font-size: 0.75rem;
  color: var(--cinnabar);
  flex-shrink: 0;
  margin-bottom: 0.2rem;
}
.chronicles-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.chronicles-scroll .chr-entry {
  display: block;
  font-size: 0.72rem;
  line-height: 1.5;
  padding: 0.1rem 0;
  border-bottom: 1px dotted rgba(196, 168, 124, 0.3);
}
.chronicles-scroll .chr-entry:last-child { border-bottom: none; }
.chronicles-bar .chr-date { color: var(--ink-fade); font-size: 0.65rem; }
.chronicles-bar .chr-good { color: var(--jade); }
.chronicles-bar .chr-bad { color: var(--cinnabar); }
.chronicles-bar .chr-neutral { color: var(--ink-light); }
.chronicles-bar .chr-empty { color: var(--ink-fade); font-size: 0.72rem; display: block; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; margin-bottom: 0.5rem; }
.stat-card { background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px; padding: 0.3rem 0.4rem; text-align: center; }
.stat-card .label { font-size: 0.72rem; color: var(--ink-fade); letter-spacing: 0.08em; }
.stat-card .value { font-size: 1.2rem; font-weight: 700; color: var(--ink); }
.stat-card .value.warn { color: var(--cinnabar); }
.stat-card .value.good { color: var(--jade); }
.stat-card .value.gold { color: var(--gold); }

.panel { background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px; padding: 0.45rem 0.6rem; margin-bottom: 0.4rem; }
.panel-title { font-family: 'STKaiti', 'KaiTi', serif; font-size: 0.95rem; color: var(--ink); border-bottom: 1px dashed var(--border); padding-bottom: 0.2rem; margin-bottom: 0.35rem; letter-spacing: 0.1em; }
.panel-title::before { content: '◆ '; color: var(--cinnabar); font-size: 0.5rem; vertical-align: middle; }

.decision-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.35rem; }
.decision-card {
  background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px;
  padding: 0.35rem 0.4rem; cursor: pointer; transition: all 0.15s; position: relative; font-size: 0.75rem;
}
.decision-card:hover { border-color: var(--cinnabar); background: #fff; box-shadow: 0 2px 8px var(--shadow); }
.decision-card .card-title { font-weight: 700; color: var(--ink); font-size: 0.85rem; }
.decision-card .card-cost { font-size: 0.68rem; color: var(--cinnabar); }
.decision-card .card-desc { font-size: 0.72rem; color: var(--ink-fade); margin-top: 0.15rem; line-height: 1.3; }
.decision-card.used { opacity: 0.3; pointer-events: none; }
.decision-card.used::after { content: '已决'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; color: var(--cinnabar); opacity: 0.5; font-family: 'STKaiti', 'KaiTi', cursive; }

.disciple-list { display: flex; flex-direction: column; gap: 0.2rem; max-height: 300px; overflow-y: auto; }
.disciple-card { display: flex; justify-content: space-between; align-items: center; padding: 0.2rem 0.4rem; background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px; font-size: 0.75rem; }
.disciple-info { flex: 1; }
.disciple-name { font-weight: 700; color: var(--ink); font-size: 0.85rem; }
.disciple-stats { color: var(--ink-fade); font-size: 0.72rem; }
.disciple-stats span { margin-right: 0.35rem; }
.disciple-stats .stat-low { color: var(--cinnabar); }

.event-log { max-height: 120px; overflow-y: auto; font-size: 0.75rem; line-height: 1.5; }
.event-entry { padding: 0.15rem 0; border-bottom: 1px dotted var(--border); }
.event-entry:last-child { border-bottom: none; }
.event-month { color: var(--cinnabar); font-weight: 700; margin-right: 0.3em; }
.event-good { color: var(--jade); }
.event-bad { color: var(--cinnabar); }
.event-neutral { color: var(--ink-light); }

.art-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.art-tag { padding: 0.15rem 0.4rem; border: 1px solid var(--border); border-radius: 2px; font-size: 0.72rem; background: var(--paper-light); color: var(--ink); }
.art-tag.unlearned { background: #f0f0f0; color: var(--ink-fade); }
.art-tag .unlearned-label { color: var(--cinnabar); font-size: 0.6rem; }

.btn { font-family: 'STKaiti', 'KaiTi', serif; font-size: 0.78rem; padding: 0.3rem 0.8rem; border: 1px solid var(--border); border-radius: 2px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.06em; background: var(--paper-light); color: var(--ink); }
.btn:hover { background: var(--paper-dark); transform: translateY(-1px); box-shadow: 0 2px 6px var(--shadow); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-primary { background: var(--cinnabar); color: #fff; border-color: var(--cinnabar); }
.btn-primary:hover { background: var(--cinnabar-light); }
.btn-jade { background: var(--jade); color: #fff; border-color: var(--jade); }
.btn-jade:hover { background: var(--jade-light); }
.btn-gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn-gold:hover { background: var(--gold-light); }
.btn-sm { font-size: 0.72rem; padding: 0.2rem 0.5rem; }
.btn-lg { font-size: 0.9rem; padding: 0.4rem 1.5rem; }

.advance-section { text-align: center; margin: 0.35rem 0; }
.advance-hint { font-size: 0.7rem; color: var(--ink-fade); margin-top: 0.15rem; }

.tournament-panel { text-align: center; background: linear-gradient(135deg, var(--paper-light), #fff8e7); border: 2px solid var(--gold); }
.tournament-panel .panel-title { font-size: 1.2rem; color: var(--cinnabar); border-bottom-color: var(--gold); }
.tournament-result { font-size: 0.85rem; line-height: 1.6; margin: 0.5rem 0; }
.rank-display { font-size: 2.2rem; font-family: 'STKaiti', 'KaiTi', cursive; color: var(--gold); margin: 0.3rem 0; }

.start-screen { text-align: center; padding: 2rem 1rem; }
.start-screen h1 { font-family: 'STKaiti', 'KaiTi', cursive; font-size: 2.8rem; color: var(--ink); letter-spacing: 0.3em; margin-bottom: 0.3rem; }
.start-screen .poem { writing-mode: vertical-rl; display: inline-block; font-size: 0.9rem; color: var(--ink-fade); letter-spacing: 0.25em; line-height: 2.5; margin: 1rem 0; height: 160px; }
.start-input { margin: 1rem 0; }
.start-input label { font-size: 1rem; color: var(--ink-light); display: block; margin-bottom: 0.4rem; }
.start-input input { font-family: 'STKaiti', 'KaiTi', serif; font-size: 1.2rem; padding: 0.4rem 0.8rem; border: 2px solid var(--border); border-radius: 2px; background: var(--paper-light); color: var(--ink); text-align: center; width: 240px; letter-spacing: 0.15em; }
.start-input input:focus { outline: none; border-color: var(--cinnabar); }

.save-panel { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(44, 24, 16, 0.7); z-index: 100; justify-content: center; align-items: center; }
.save-panel.show { display: flex; }
.save-dialog { background: var(--paper); border: 3px solid var(--border); border-radius: 2px; padding: 1.5rem; max-width: 480px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.save-slot { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 2px; margin-bottom: 0.3rem; background: var(--paper-light); cursor: pointer; transition: all 0.15s; }
.save-slot:hover { background: #fff; border-color: var(--cinnabar); }
.save-slot .slot-time { color: var(--ink-fade); font-size: 0.7rem; }
.save-slot .slot-info { font-weight: 700; }

.loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(44, 24, 16, 0.4); z-index: 200; justify-content: center; align-items: center; }
.loading-overlay.show { display: flex; }
.loading-spinner { font-size: 2rem; color: var(--cinnabar); animation: fadeIn 0.3s ease-out; }

/* 事件弹窗 */
.event-popup { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(44, 24, 16, 0.35); z-index: 150; justify-content: center; align-items: center; }
.event-popup.show { display: flex; }
.event-dialog { background: var(--paper); border: 3px solid var(--cinnabar); border-radius: 2px; padding: 1.2rem 1.5rem; max-width: 520px; width: 90%; max-height: 70vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.event-dialog .event-title { font-family: 'STKaiti', 'KaiTi', cursive; font-size: 1.1rem; color: var(--cinnabar); text-align: center; margin-bottom: 0.8rem; }
.event-dialog .event-item { padding: 0.35rem 0; border-bottom: 1px dotted var(--border); line-height: 1.5; font-size: 0.85rem; }
.event-dialog .event-item:last-child { border-bottom: none; }
.event-dialog .event-item.good { color: var(--jade); }
.event-dialog .event-item.bad { color: var(--cinnabar); }
.event-dialog .event-item.neutral { color: var(--ink-light); }
.event-dialog .event-dismiss { display: block; margin: 0.8rem auto 0; }

::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-track { background: rgba(196, 168, 124, 0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb { background: var(--ink-fade); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-light); }

@media (max-width: 750px) {
  .book-layout { grid-template-columns: 1fr; }
  .book-layout::after { display: none; }
  .left-page, .right-page { padding: 0.4rem 0.6rem; }
  .decision-grid { grid-template-columns: 1fr 1fr; }
  .scroll-container { height: auto; width: 100%; }
  body { overflow: auto; height: auto; align-items: flex-start; }
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease-out; }
.hidden { display: none !important; }

</style>
</head>
<body>

<div class="scroll-container" id="app">
  <div id="content"></div>
</div>

<!-- 存档对话框 -->
<div class="save-panel" id="savePanel">
  <div class="save-dialog" id="saveDialog"></div>
</div>

<!-- 加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner">⏳ 静待片刻...</div>
</div>

<!-- 事件弹窗 -->
<div class="event-popup" id="eventPopup">
  <div class="event-dialog" id="eventDialog"></div>
</div>

<script>

// ============================================================
// 《掌门日记》v2.0 — API 驱动版
// 后端: Rust axum → PostgreSQL
// ============================================================

// ========== 配置 ==========
const API_BASE = (() => {
  // 同源则用相对路径，否则指向 localhost:3000
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return window.location.port === '3000' ? '/api' : 'http://localhost:3000/api';
  }
  return 'http://localhost:3000/api';
})();

// ========== 静态数据（与后端保持同步）==========



let DECISIONS = [];  // 从后端 API 获取
let MARTIAL_ARTS = [];  // 从后端 API 获取

// ========== 游戏状态 ==========

let gameId = null;         // 当前游戏 UUID
let G = null;              // 当前游戏状态缓存
let usedDecisions = [];    // 本月已用决策 ID
let saveSlots = [];        // 存档槽（服务器端列表）

// ========== API 工具 ==========

function showLoading() { document.getElementById('loadingOverlay').classList.add('show'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

async function api(method, path, body) {
  const url = API_BASE + path;
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    throw new Error(err.error || `请求失败: ${res.status}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ========== 存档管理（服务器端）==========

async function refreshSaveSlots() {
  try {
    const data = await api('GET', '/games');
    saveSlots = (data.games || []).map(g => ({
      id: g.id,
      sect_name: g.sect_name,
      year: g.state?.year || 1,
      month: g.state?.month || 1,
      prestige: g.state?.prestige || 0,
      silver: g.state?.silver || 0,
      disciples: g.state?.disciples?.filter(d => d.alive)?.length || 0,
      updated_at: g.updated_at,
    }));
  } catch (e) {
    console.warn('获取存档列表失败:', e);
    saveSlots = [];
  }
}

async function deleteSaveSlot(id) {
  if (!confirm('确定删除此存档？')) return;
  showLoading();
  try {
    await api('DELETE', `/games/${id}`);
    if (gameId === id) { gameId = null; G = null; }
    await refreshSaveSlots();
    showLoadOrSavePanel('load');
  } catch (e) {
    alert('删除失败: ' + e.message);
  } finally {
    hideLoading();
  }
}

// ========== 游戏流程 ==========

async function startGame() {
  const input = document.getElementById('sectNameInput');
  const name = (input ? input.value.trim() : '') || '无名派';
  showLoading();
  try {
    const data = await api('POST', '/games', { sect_name: name });
    gameId = data.id;
    G = data.state;
    // 适配渲染用的字段名
    G.sect_name = name;
    usedDecisions = [];
    renderGame();
  } catch (e) {
    alert('创建游戏失败: ' + e.message + '\n\n请确认后端已启动: ' + API_BASE);
  } finally {
    hideLoading();
  }
}

async function loadGameAndStart(id) {
  showLoading();
  try {
    const data = await api('GET', `/games/${id}`);
    if (data.error) { alert(data.error); return; }
    gameId = data.id;
    G = data.state;
    G.sect_name = data.sect_name;
    usedDecisions = [];
    hideSavePanel();
    renderGame();
  } catch (e) {
    alert('载入失败: ' + e.message);
  } finally {
    hideLoading();
  }
}

async function executeDecision(decisionId) {
  if (usedDecisions.includes(decisionId)) return;
  if (!gameId || !G) return;
  showLoading();
  try {
    const data = await api('POST', `/games/${gameId}/decisions/${decisionId}`);
    G = data.state;
    G.sect_name = G.sect_name || '';
    usedDecisions.push(decisionId);

    // 决策事件直接更新纪事，不弹窗
    if (G.game_over) {
      renderGameOver();
    } else {
      renderGame();
    }
  } catch (e) {
    alert('决策失败: ' + e.message);
  } finally {
    hideLoading();
  }
}

async function advanceAndRender() {
  if (!gameId || !G) return;
  showLoading();
  try {
    const data = await api('POST', `/games/${gameId}/advance`);
    G = data.state;
    G.sect_name = G.sect_name || '';

    usedDecisions = [];

    // ★ 展示事件弹窗
    if (data.events?.length > 0 || data.tournament) {
      showEventPopup(data.events || [], data.tournament);
      return; // 等用户关闭弹窗后再渲染
    }

    if (G.game_over) {
      renderGameOver();
    } else {
      renderGame();
    }
  } catch (e) {
    alert('推进失败: ' + e.message);
  } finally {
    hideLoading();
  }
}

// ★ 事件弹窗
function showEventPopup(events, tournament) {
  const dialog = document.getElementById('eventDialog');
  let html = '';

  if (tournament) {
    const rankNames = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    html += `<div class="event-title">🏆 年 终 论 剑</div>
      <div style="text-align:center;font-size:2rem;color:var(--gold);margin:0.5rem 0;">第 ${rankNames[Math.min(tournament.rank, 10)] || tournament.rank} 名</div>
      <div style="text-align:center;font-size:0.85rem;color:var(--ink-light);margin-bottom:0.8rem;">
        天下共 <strong>${tournament.total_sects}</strong> 派与会 · 战力：${tournament.power}<br>
        ${tournament.desc_text}
      </div>`;
    if (events.length > 0) {
      html += '<div style="border-top:1px dashed var(--border);margin:0.6rem 0;"></div>';
    }
  }

  if (events.length > 0) {
    html += `<div class="event-title">📜 本月纪事</div>`;
    events.forEach(ev => {
      const moodClass = ev.mood === 'good' ? 'good' : ev.mood === 'bad' ? 'bad' : 'neutral';
      html += `<div class="event-item ${moodClass}">${ev.text}</div>`;
    });
  }

  html += `<button class="btn btn-primary event-dismiss" id="eventDismissBtn" onclick="closeEventPopup()">知道了</button>`;
  dialog.innerHTML = html;
  document.getElementById('eventPopup').classList.add('show');
  // ★ 弹窗弹出后：blur 掉底层按钮焦点，聚焦弹窗按钮，防止空格/回车误触推进
  if (document.activeElement) document.activeElement.blur();
  setTimeout(() => {
    const btn = document.getElementById('eventDismissBtn');
    if (btn) btn.focus();
  }, 50);
}

function closeEventPopup() {
  document.getElementById('eventPopup').classList.remove('show');
  // 弹窗关闭后重新渲染游戏界面
  if (G && !G.game_over) {
    renderGame();
  } else if (G && G.game_over) {
    renderGameOver();
  }
}

// ========== 工具函数 ==========

function fmtSilver(n) { return n >= 0 ? '银' + n + '两' : '欠' + Math.abs(n) + '两'; }

function getCombatScore(d) {
  const art = MARTIAL_ARTS.find(a => a.id === d.martial_art) || MARTIAL_ARTS[4];
  return Math.floor(d.talent * 0.3 + d.inner_power * 0.3 + (art.atk + art.def + art.spd) * 3 + d.loyalty * 0.1);
}

// ========== UI 渲染 ==========

function renderApp() {
  if (!G) {
    renderStartScreen();
    return;
  }
  if (G.game_over) {
    renderGameOver();
    return;
  }
  renderGame();
}

function renderStartScreen() {
  const container = document.getElementById('content');
  container.innerHTML = `<div class="start-screen fade-in">
    <h1>掌 门 日 记</h1>
    <div class="subtitle">武侠门派经营模拟器 · v2.0</div>
    <div class="poem">
      白手起家开山门<br>
      招贤纳士聚英魂<br>
      江湖风云多变幻<br>
      论剑之日定乾坤
    </div>
    <div class="start-input">
      <label>请为山门赐名：</label>
      <input type="text" id="sectNameInput" placeholder="如：青云门" maxlength="10" autocomplete="off">
    </div>
    <div style="margin-top: 1.5rem;">
      <button class="btn btn-primary" onclick="startGame()" style="font-size:1.1rem;padding:0.6rem 2.5rem;">
        开 山 立 派
      </button>
    </div>
    <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--ink-fade);">
      已有存档？<a href="javascript:void(0)" onclick="showLoadScreen()" style="color:var(--cinnabar);">载入进度</a>
    </div>
    <div style="margin-top: 0.6rem; font-size: 0.7rem; color: var(--ink-fade);">
      后端: <code id="apiStatus">${API_BASE}</code>
    </div>
  </div>`;
  setTimeout(() => {
    const inp = document.getElementById('sectNameInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
    }
  }, 100);
}

async function showLoadScreen() {
  showLoading();
  await refreshSaveSlots();
  hideLoading();
  showLoadOrSavePanel('load');
}

function showLoadOrSavePanel(mode) {
  const panel = document.getElementById('savePanel');
  const dialog = document.getElementById('saveDialog');
  const isLoad = mode === 'load';

  if (saveSlots.length === 0) {
    dialog.innerHTML = `
      <div class="panel-title">${isLoad ? '载入存档' : '存档管理'}</div>
      <div style="text-align:center;color:var(--ink-fade);padding:2rem;">尚无存档记录。</div>
      <button class="btn" onclick="hideSavePanel()">返回</button>
    `;
  } else {
    dialog.innerHTML = `
      <div class="panel-title">${isLoad ? '载入存档' : '存档管理'}</div>
      <div style="max-height:350px;overflow-y:auto;margin-bottom:1rem;">
        ${saveSlots.map(s => `
          <div class="save-slot" ${isLoad ? `onclick="loadGameAndStart('${s.id}')"` : ''}>
            <div>
              <div class="slot-info">
                ${s.id === gameId ? '● ' : ''}${s.sect_name || '未命名'} — 第${s.year}年第${s.month}月
                ${s.id === gameId ? '<span style="color:var(--cinnabar);font-size:0.7rem;">（当前）</span>' : ''}
              </div>
              <div class="slot-time">声望${s.prestige} · 库银${s.silver}两 · ${s.disciples}名弟子 · ${s.updated_at ? new Date(s.updated_at).toLocaleString('zh-CN') : ''}</div>
            </div>
            <div>
              ${isLoad ? '' : `<button class="btn btn-sm" onclick="event.stopPropagation();loadGameAndStart('${s.id}')">载入</button>`}
              <button class="btn btn-sm" onclick="event.stopPropagation();deleteSaveSlot('${s.id}')">删除</button>
            </div>
          </div>
        `).join('')}
      </div>
      <button class="btn" onclick="hideSavePanel()">返回</button>
    `;
  }
  panel.classList.add('show');
}

function showSavePanel() {
  refreshSaveSlots().then(() => showLoadOrSavePanel('manage'));
}

function hideSavePanel() {
  document.getElementById('savePanel').classList.remove('show');
}

function renderGameOver() {
  const container = document.getElementById('content');
  const alive = G.disciples?.filter(d => d.alive)?.length || 0;
  container.innerHTML = `
    <div class="start-screen fade-in" style="padding:2rem;">
      <h1 style="font-size:2.2rem;color:var(--cinnabar);">山 门 落 幕</h1>
      <div style="font-size:1.1rem;color:var(--ink-light);margin:1.5rem 0;line-height:2;">
        ${G.sect_name}<br>
        第${G.year}年${G.month}月<br><br>
        ${G.game_over_reason}
      </div>
      <div style="color:var(--ink-fade);margin-bottom:1rem;">
        声望：${G.prestige} · 库银：${G.silver}两 · 弟子：${alive}人
      </div>
      <button class="btn btn-primary" onclick="G=null;gameId=null;renderStartScreen();" style="font-size:1.1rem;padding:0.6rem 2rem;">
        重 头 再 来
      </button>
      <div style="margin-top:1rem;">
        <button class="btn btn-sm" onclick="showSavePanel()">查看存档 / 回档</button>
      </div>
    </div>
  `;
}

function renderGame() {
  const container = document.getElementById('content');

  const isDecember = G.month === 12;
  const aliveDisciples = G.disciples?.filter(d => d.alive) || [];
  const decisionsLeft = G.max_decisions - usedDecisions.length;

  let html = '';

  // ===== 顶部标题栏 =====
  html += `<div class="top-bar">
    <div class="nav-btns">
      <button class="btn btn-sm" onclick="showSavePanel()">存档</button>
      <button class="btn btn-sm btn-jade" onclick="confirmNewGame()">重开</button>
    </div>
    <div class="title-block">
      <h1>${G.sect_name}<span class="subtitle"> · 掌门日记</span></h1>
      <div class="month-text">
        第 <strong>${G.year}</strong> 年 · <strong>${G.month}</strong> 月
        ${G.injury > 30 ? '<span class="injured-tag">（掌门负伤中）</span>' : ''}
      </div>
    </div>
  </div>`;

  // ===== 双栏书卷 =====
  html += '<div class="book-layout">';

  // ---- 左页：状态 + 弟子 + 纪事 ----
  html += '<div class="left-page">';

  html += `<div class="stats-grid">
    <div class="stat-card"><div class="label">江湖声望</div><div class="value ${G.prestige>=70?'good':G.prestige<=20?'warn':''}">${G.prestige}</div></div>
    <div class="stat-card"><div class="label">库银</div><div class="value ${G.silver>=200?'gold':G.silver<=30?'warn':''}">${G.silver}两</div></div>
    <div class="stat-card"><div class="label">门人志气</div><div class="value ${G.morale>=70?'good':G.morale<=20?'warn':''}">${G.morale}</div></div>
    <div class="stat-card"><div class="label">掌门伤势</div><div class="value ${G.injury>=50?'warn':G.injury<=10?'good':''}">${G.injury}</div></div>
  </div>`;

  html += `<div class="panel"><div class="panel-title">门下弟子（${aliveDisciples.length}人）</div>`;
  if (aliveDisciples.length === 0) {
    html += '<div style="text-align:center;color:var(--ink-fade);padding:0.5rem;font-size:0.75rem;">山门冷清，尚无弟子。</div>';
  } else {
    html += '<div class="disciple-list">';
    aliveDisciples.forEach(d => {
      const art = MARTIAL_ARTS.find(a => a.id === d.martial_art);
      html += `<div class="disciple-card">
        <div class="disciple-info">
          <span class="disciple-name">${d.name}</span>
          ${d.loyalty < 25 ? '<span style="color:var(--cinnabar);font-size:0.6rem;">（心思浮动）</span>' : ''}
          <span class="disciple-stats">
            资质<strong>${d.talent}</strong>
            内力<strong class="${d.inner_power<20?'stat-low':''}">${d.inner_power}</strong>
            ${art?art.name:'无'}
            忠<strong class="${d.loyalty<25?'stat-low':''}">${d.loyalty}</strong>
          </span>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  html += '</div>';

  html += '</div>'; // end left-page

  // ---- 右页：决策 + 论剑 + 武学 ----
  html += '<div class="right-page">';

  if (isDecember) {
    // 十二月：显示论剑面板
    // 论剑结果来自最近的 tournament_history
    const th = G.tournament_history || [];
    const lastT = th.length > 0 ? th[th.length - 1] : null;
    const rankNames = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

    if (lastT && lastT.year === G.year) {
      // 已举行过论剑（回档等情况）
      html += `<div class="panel tournament-panel">
        <div class="panel-title">年 终 论 剑</div>
        <div class="rank-display">第 ${rankNames[Math.min(lastT.rank, 10)] || lastT.rank} 名</div>
        <div class="tournament-result">
          天下共 <strong>${lastT.total_sects}</strong> 派与会 · 本派战力：${lastT.power}<br>
          论剑已毕，来年再战！
        </div>
      </div>`;
    } else {
      html += `<div class="panel tournament-panel">
        <div class="panel-title">年 终 论 剑</div>
        <div class="tournament-result">
          岁末将至，天下各派蓄势待发……<br>
          点击下方按钮推进，参与本年论剑！
        </div>
      </div>`;
    }

    html += `<div class="advance-section">
      <button class="btn btn-primary btn-lg" onclick="advanceAndRender()">辞旧迎新，进入${G.year+1}年</button>
    </div>`;
  }

  if (!isDecember) {
    html += `<div class="panel"><div class="panel-title">本月决策（尚余 ${decisionsLeft} 次）</div>`;
    if (decisionsLeft > 0) {
      html += '<div class="decision-grid">';
      DECISIONS.forEach(dec => {
        const used = usedDecisions.includes(dec.id);
        // 前端简单预检
        let available = !used;
        if (dec.costType === 'silver' && G.silver < dec.cost) available = false;
        if (dec.id === 'train' && G.injury >= 30) available = false;
        if (dec.id === 'study' && G.martial_arts_learned?.length >= MARTIAL_ARTS.length) available = false;
        if (dec.id === 'rest' && G.injury <= 5) available = false;
        const costText = dec.costType === 'silver' ? `花费${fmtSilver(dec.cost)}` : '不耗银两';
        html += `<div class="decision-card ${used?'used':''}"
             ${available?`onclick="executeDecision('${dec.id}')"`:''}
             style="${!available&&!used?'opacity:0.45;cursor:not-allowed;':''}">
          <div class="card-title">${dec.title}</div>
          <div class="card-cost">${costText}</div>
          <div class="card-desc">${dec.desc}</div>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="advance-section">';
    html += `<button class="btn btn-gold btn-lg" onclick="advanceAndRender()" ${usedDecisions.length===0?'disabled':''}>${usedDecisions.length>0?'本月事毕，推进时日 →':'请至少做一项决策'}</button>`;
    if (usedDecisions.length === 0) html += '<div class="advance-hint">点击上方决策卡片处理本月事务</div>';
    html += '</div>';
  }

  html += `<div class="panel"><div class="panel-title">本派武学（${G.martial_arts_learned?.length||0}/${MARTIAL_ARTS.length}）</div><div class="art-tags">`;
  MARTIAL_ARTS.forEach(art => {
    const learned = G.martial_arts_learned?.includes(art.id);
    html += `<span class="art-tag${learned?'':' unlearned'}">${art.name}<span style="font-size:0.6rem;color:var(--ink-fade);">(${art.type})</span>${learned?'':' <span class="unlearned-label">未习</span>'}</span>`;
  });
  html += '</div></div>';

  html += '</div>'; // end right-page
  html += '</div>'; // end book-layout

  // ===== 底部纪事横栏 =====
  const log = G.event_log || [];
  html += '<div class="chronicles-bar">';
  html += '<span class="chronicles-title">◆ 门中纪事</span>';
  html += '<div class="chronicles-scroll">';
  if (log.length === 0) {
    html += '<span class="chr-empty">山门初立，尚无纪事。</span>';
  } else {
    // 降序排列：最新的在最上面
    const recent = log.slice(-15).reverse();
    recent.forEach(ev => {
      const dateStr = ev.year ? `第${ev.year}年${ev.month}月` : '';
      html += `<span class="chr-entry">${dateStr ? `<span class="chr-date">${dateStr}</span> ` : ''}<span class="chr-${ev.mood}">${ev.text}</span></span>`;
    });
    if (log.length > 15) html += '<span style="color:var(--ink-fade);font-size:0.65rem;">…… 更早的纪事 ……</span>';
  }
  html += '</div></div>';

  container.innerHTML = html;

  // ★ 纪事栏自动滚到顶部（最新消息在最上面）
  setTimeout(() => {
    const scroll = document.querySelector('.chronicles-scroll');
    if (scroll) scroll.scrollTop = 0;
  }, 50);
}

function confirmNewGame() {
  if (confirm('确定重开山门？')) {
    G = null;
    gameId = null;
    renderStartScreen();
  }
}

// ========== 键盘快捷键 ==========
document.addEventListener('keydown', function(e) {
  const popup = document.getElementById('eventPopup');
  const popupVisible = popup && popup.classList.contains('show');
  if (e.key === 'Escape') {
    if (popupVisible) { closeEventPopup(); }
    else { hideSavePanel(); }
    return;
  }
  // 弹窗可见时，Enter/Space 关闭弹窗（防止误触底层按钮）
  if (popupVisible && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    closeEventPopup();
  }
});

// ========== 自适应全屏缩放 ==========
// 基准尺寸 1020×780，窗口大于基准时等比放大填满，小于时不缩小
// BORDER_ALLOWANCE = 外层 box-shadow 装饰框宽度（12px 每侧 × 2）
const BASE_W = 1020, BASE_H = 780, BORDER = 28;

function updateScale() {
  const container = document.querySelector('.scroll-container');
  if (!container) return;
  const vw = window.innerWidth, vh = window.innerHeight;

  // 小屏（<750px）不缩放，交给 CSS media query 处理
  if (vw < 750) {
    container.style.transform = '';
    return;
  }

  // 扣除 body padding，确保外层装饰框不被视口裁剪
  const bodyStyle = getComputedStyle(document.body);
  const padX = parseFloat(bodyStyle.paddingLeft) + parseFloat(bodyStyle.paddingRight);
  const padY = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const availW = vw - padX;
  const availH = vh - padY;
  const scaleX = availW / (BASE_W + BORDER);
  const scaleY = availH / (BASE_H + BORDER);
  const scale = Math.max(1, Math.min(scaleX, scaleY));
  container.style.transform = scale > 1 ? `scale(${scale})` : '';
}

window.addEventListener('resize', updateScale);
window.addEventListener('load', updateScale);
updateScale();

// ========== 数据初始化（从后端加载静态资源）==========
async function loadStaticData() {
  try {
    const [decRes, artRes] = await Promise.all([
      api('GET', '/decisions'),
      api('GET', '/martial-arts'),
    ]);
    DECISIONS = decRes.decisions || [];
    // 后端字段 art_type → 前端期望 type
    MARTIAL_ARTS = (artRes.arts || []).map(a => ({ ...a, type: a.art_type || a.type }));
    // 为非十二月渲染准备决策描述：适配后端字段名
    DECISIONS.forEach(d => { d.costType = d.cost_type || d.costType; });
  } catch (e) {
    console.warn('加载静态数据失败，使用默认:', e);
  }
}

// ========== 初始化 ==========
(async () => {
  await loadStaticData();
  renderStartScreen();
})();

</script>

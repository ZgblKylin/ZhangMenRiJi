<!--
  ============================================================================
   《掌门日记》—— 武侠门派经营模拟器
  ============================================================================
  
  设计思路：
  
  1. 核心循环：以"月"为基本时间单位推进，每月玩家做 2~3 个关键决策，门派状态随之演化。
     每年十二月举行「年终论剑」，是检验门派实力的重要节点。至少可玩 24 个月（两届论剑）。
  
  2. 门派属性（去游戏术语，取武侠味）：
     - 江湖声望：影响弟子慕名来投的概率、论剑排名权重
     - 库银：门派银两，维持运转之本，枯竭则弟子出走
     - 门人志气：集体士气，影响弟子修炼效率与外派成功率
     - 掌门伤势：掌门负伤会影响所有决策效果，重伤需静养
  
  3. 弟子系统：
     - 每位弟子有：姓名、资质（1-100）、内力（1-100）、武学专精、忠诚度（1-100）
     - 每月自动成长（内力微增，忠诚度随门派状态浮动）
     - 忠诚度低于阈值可能叛逃
     - 可招募新弟子（需消耗库银）
     - 可外派执行任务（获得库银/声望/武学残卷）
  
  4. 武学体系（5 门自创武功）：
     - 太虚剑法：攻守兼备，普适性强
     - 九阳烈掌：至刚至猛，刚猛路子
     - 玄冰心经：以柔克刚，内功深厚
     - 追风步：轻功绝伦，闪避见长
     - 混元功：浑厚绵长，根基扎实
  
  5. 随机事件系统：
     分「江湖风云」与「门中生息」两大类，每月至少触发一件。
     江湖风云：邻派挑衅、朝廷封赏、豪杰来投、山贼扰民、秘笈出世……
     门中生息：米价上涨、练功场损毁、弟子口角、掌门染恙、奇遇顿悟……
  
  6. 年终论剑：
     每年十二月自动触发。各弟子以四项属性加权评分，与江湖各派同台竞技。
     论剑结果影响来年声望与弟子成长。
  
  7. 存档系统：
     - LocalStorage 自动存档（每月推进后自动保存）
     - 保留最近三个月的存档快照，可供回档
     - JSON 导出/导入功能
  
  8. UI 设计：
     - 宣纸底色（泛黄）、竖排标题、行楷风字体栈
     - 配色取水墨丹青：墨色为主，朱砂点缀
     - 文字用半文半白语气，合乎武侠小说行文习惯
     - 所有交互在主界面完成，避免弹窗过多
  
  技术选型：纯 HTML/CSS/JS，零外部依赖，打开即玩。
  ============================================================================
-->
<!DOCTYPE html>

/* ============================================================
   CSS — 武侠宣纸风主题 · 左右书卷布局
   ============================================================ */
:root {
  --paper: #f5e6c8;
  --paper-dark: #e8d5a8;
  --paper-light: #faf3e4;
  --ink: #2c1810;
  --ink-light: #5c3d2e;

  --jade: #4a7c59;
  --jade-light: #6ba37a;
  --gold: #b8860b;
  --gold-light: #daa520;
  --border: #c4a87c;
  --shadow: rgba(44, 24, 16, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'STSong', 'SimSun', serif;
  background: #3c2415;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(139, 115, 85, 0.3) 0%, transparent 60%),
    radial-gradient(ellipse at 20% 80%, rgba(196, 58, 49, 0.05) 0%, transparent 50%);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--ink);
  overflow: hidden;
  padding: 0.8rem;
}

.scroll-container {
  width: 100%;
  max-width: 1020px;
  height: 94vh;
  max-height: 780px;
  background: var(--paper);
  background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  border: 3px solid var(--border);
  border-radius: 3px;
  box-shadow:
    0 2px 20px var(--shadow),
    0 0 0 8px var(--paper-dark),
    0 0 0 11px var(--border),
    0 0 0 12px var(--paper-dark);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.scroll-container::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(139, 115, 85, 0.05) 28px, rgba(139, 115, 85, 0.05) 29px);
  pointer-events: none; z-index: 0;
}

.top-bar {
  position: relative; z-index: 1;
  text-align: center;
  padding: 0.5rem 1.5rem 0.3rem;
  border-bottom: 2px solid var(--border);

  background: linear-gradient(to bottom, rgba(250, 243, 228, 0.6), transparent);
}
.top-bar h1 { font-family: 'STKaiti', 'KaiTi', cursive; font-size: 1.8rem; color: var(--ink); letter-spacing: 0.25em; margin: 0; }
.top-bar .subtitle { font-size: 0.7rem; color: var(--ink-fade); letter-spacing: 0.2em; }
.top-bar .month-text { font-size: 0.95rem; color: var(--ink-light); letter-spacing: 0.15em; margin-top: 0.15rem; }
.top-bar .month-text strong { color: var(--cinnabar); font-size: 1.1rem; }
.top-bar .injured-tag { color: var(--cinnabar); font-size: 0.7rem; }

.book-layout {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 2fr 3fr;
  flex: 1;
  overflow: hidden;
}

.book-layout::after {
  content: '';
  position: absolute; top: 0; bottom: 0; left: 40%;
  width: 2px;
  background: linear-gradient(to bottom, transparent, rgba(196, 58, 49, 0.25), rgba(139, 115, 85, 0.15), rgba(196, 58, 49, 0.25), transparent);
  pointer-events: none; z-index: 2;
}

.left-page, .right-page { overflow-y: auto; overflow-x: hidden; padding: 0.6rem 0.8rem; }
.left-page { padding-right: 1.2rem; }
.right-page { padding-left: 1.2rem; }

.bottom-bar {
  position: relative; z-index: 1;
  display: flex; justify-content: center; gap: 0.4rem;
  padding: 0.4rem 1rem;
  border-top: 1px solid var(--border);
  flex-shrink: 0; flex-wrap: wrap;
  background: linear-gradient(to top, rgba(250, 243, 228, 0.4), transparent);
}

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; margin-bottom: 0.5rem; }
.stat-card { background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px; padding: 0.3rem 0.4rem; text-align: center; }
.stat-card .label { font-size: 0.65rem; color: var(--ink-fade); letter-spacing: 0.08em; }
.stat-card .value { font-size: 1.2rem; font-weight: 700; color: var(--ink); }
.stat-card .value.warn { color: var(--cinnabar); }
.stat-card .value.good { color: var(--jade); }
.stat-card .value.gold { color: var(--gold); }

.panel { background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px; padding: 0.45rem 0.6rem; margin-bottom: 0.4rem; }
.panel-title { font-family: 'STKaiti', 'KaiTi', serif; font-size: 0.95rem; color: var(--ink); border-bottom: 1px dashed var(--border); padding-bottom: 0.2rem; margin-bottom: 0.35rem; letter-spacing: 0.1em; }
.panel-title::before { content: '◆ '; color: var(--cinnabar); font-size: 0.5rem; vertical-align: middle; }

.decision-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.35rem; }
.decision-card {
  background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px;
  padding: 0.35rem 0.4rem; cursor: pointer; transition: all 0.15s; position: relative; font-size: 0.72rem;
}
.decision-card:hover { border-color: var(--cinnabar); background: #fff; box-shadow: 0 2px 8px var(--shadow); }
.decision-card .card-title { font-weight: 700; color: var(--ink); font-size: 0.82rem; }
.decision-card .card-cost { font-size: 0.65rem; color: var(--cinnabar); }
.decision-card .card-desc { font-size: 0.68rem; color: var(--ink-fade); margin-top: 0.15rem; line-height: 1.3; }
.decision-card.used { opacity: 0.3; pointer-events: none; }
.decision-card.used::after { content: '已决'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; color: var(--cinnabar); opacity: 0.5; font-family: 'STKaiti', 'KaiTi', cursive; }

.disciple-list { display: flex; flex-direction: column; gap: 0.2rem; }
.disciple-card { display: flex; justify-content: space-between; align-items: center; padding: 0.2rem 0.4rem; background: var(--paper-light); border: 1px solid var(--border); border-radius: 2px; font-size: 0.72rem; }
.disciple-info { flex: 1; }
.disciple-name { font-weight: 700; color: var(--ink); font-size: 0.85rem; }
.disciple-stats { color: var(--ink-fade); font-size: 0.68rem; }
.disciple-stats span { margin-right: 0.35rem; }
.disciple-stats .stat-low { color: var(--cinnabar); }

.event-log { max-height: 120px; overflow-y: auto; font-size: 0.72rem; line-height: 1.5; }
.event-entry { padding: 0.15rem 0; border-bottom: 1px dotted var(--border); }
.event-entry:last-child { border-bottom: none; }
.event-month { color: var(--cinnabar); font-weight: 700; margin-right: 0.3em; }
.event-good { color: var(--jade); }
.event-bad { color: var(--cinnabar); }
.event-neutral { color: var(--ink-light); }

.art-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.art-tag { padding: 0.15rem 0.4rem; border: 1px solid var(--border); border-radius: 2px; font-size: 0.7rem; background: var(--paper-light); color: var(--ink); }
.art-tag.unlearned { background: #f0f0f0; color: var(--ink-fade); }
.art-tag .unlearned-label { color: var(--cinnabar); font-size: 0.6rem; }

.btn { font-family: 'STKaiti', 'KaiTi', serif; font-size: 0.78rem; padding: 0.3rem 0.8rem; border: 1px solid var(--border); border-radius: 2px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.06em; background: var(--paper-light); color: var(--ink); }
.btn:hover { background: var(--paper-dark); transform: translateY(-1px); box-shadow: 0 2px 6px var(--shadow); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-primary { background: var(--cinnabar); color: #fff; border-color: var(--cinnabar); }
.btn-primary:hover { background: var(--cinnabar-light); }
.btn-jade { background: var(--jade); color: #fff; border-color: var(--jade); }
.btn-jade:hover { background: var(--jade-light); }
.btn-gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn-gold:hover { background: var(--gold-light); }
.btn-sm { font-size: 0.7rem; padding: 0.2rem 0.5rem; }
.btn-lg { font-size: 0.9rem; padding: 0.4rem 1.5rem; }

.advance-section { text-align: center; margin: 0.35rem 0; }
.advance-hint { font-size: 0.65rem; color: var(--ink-fade); margin-top: 0.15rem; }

.tournament-panel { text-align: center; background: linear-gradient(135deg, var(--paper-light), #fff8e7); border: 2px solid var(--gold); }
.tournament-panel .panel-title { font-size: 1.2rem; color: var(--cinnabar); border-bottom-color: var(--gold); }
.tournament-result { font-size: 0.85rem; line-height: 1.6; margin: 0.5rem 0; }
.rank-display { font-size: 2.2rem; font-family: 'STKaiti', 'KaiTi', cursive; color: var(--gold); margin: 0.3rem 0; }

.start-screen { text-align: center; padding: 2rem 1rem; }
.start-screen h1 { font-family: 'STKaiti', 'KaiTi', cursive; font-size: 2.8rem; color: var(--ink); letter-spacing: 0.3em; margin-bottom: 0.3rem; }
.start-screen .poem { writing-mode: vertical-rl; display: inline-block; font-size: 0.9rem; color: var(--ink-fade); letter-spacing: 0.25em; line-height: 2.5; margin: 1rem 0; height: 160px; }
.start-input { margin: 1rem 0; }
.start-input label { font-size: 1rem; color: var(--ink-light); display: block; margin-bottom: 0.4rem; }
.start-input input { font-family: 'STKaiti', 'KaiTi', serif; font-size: 1.2rem; padding: 0.4rem 0.8rem; border: 2px solid var(--border); border-radius: 2px; background: var(--paper-light); color: var(--ink); text-align: center; width: 240px; letter-spacing: 0.15em; }
.start-input input:focus { outline: none; border-color: var(--cinnabar); }

.save-panel { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(44, 24, 16, 0.7); z-index: 100; justify-content: center; align-items: center; }
.save-panel.show { display: flex; }
.save-dialog { background: var(--paper); border: 3px solid var(--border); border-radius: 2px; padding: 1.5rem; max-width: 480px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.save-slot { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 2px; margin-bottom: 0.3rem; background: var(--paper-light); cursor: pointer; transition: all 0.15s; }
.save-slot:hover { background: #fff; border-color: var(--cinnabar); }
.save-slot .slot-time { color: var(--ink-fade); font-size: 0.7rem; }
.save-slot .slot-info { font-weight: 700; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 750px) {
  .book-layout { grid-template-columns: 1fr; }
  .book-layout::after { display: none; }
  .left-page, .right-page { padding: 0.4rem 0.6rem; }
  .decision-grid { grid-template-columns: 1fr 1fr; }
  .scroll-container { height: auto; max-height: none; }
  body { overflow: auto; height: auto; align-items: flex-start; }
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease-out; }
.hidden { display: none !important; }

</style>
</head>

// ========== 工具函数 ==========

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function fmtSilver(n) { return n >= 0 ? '银' + n + '两' : '欠' + Math.abs(n) + '两'; }

function generateDiscipleName() {
  const surname = pick(SURNAMES);
  const given = pick(Math.random() < 0.5 ? GIVEN_NAMES_MALE : GIVEN_NAMES_FEMALE);
  return surname + given;
}

function generateDisciple(baseTalentBonus = 0) {
  const talent = clamp(rand(20, 70) + baseTalentBonus, 10, 95);
  const innerPower = rand(10, 30);
  const art = pick(MARTIAL_ARTS.filter(a => a.reqTalent <= talent + 10));
  return {
    id: 'd' + Date.now() + '_' + rand(1000, 9999),
    name: generateDiscipleName(),
    talent,
    innerPower,
    martialArt: art.id,
    loyalty: rand(40, 70),
    monthsInSect: 0,
    alive: true,
  };
}

function getDiscipleCombatScore(d) {
  const art = MARTIAL_ARTS.find(a => a.id === d.martialArt) || MARTIAL_ARTS[4];
  return Math.floor(
    d.talent * 0.3 + d.innerPower * 0.3 + (art.atk + art.def + art.spd) * 3 + d.loyalty * 0.1
  );
}

function getSectCombatPower() {
  if (G.disciples.length === 0) return 10;
  const scores = G.disciples.filter(d => d.alive).map(getDiscipleCombatScore);
  return Math.floor(scores.reduce((a, b) => a + b, 0) / scores.length) + scores.length * 5;
}

// ========== 初始弟子 ==========

function generateStartingDisciples() {
  const d1 = generateDisciple(15);
  d1.loyalty = rand(60, 80);
  d1.innerPower = rand(25, 40);
  d1.name = pick(SURNAMES) + pick(GIVEN_NAMES_MALE);
  const d2 = generateDisciple(10);
  d2.loyalty = rand(55, 75);
  d2.innerPower = rand(20, 35);
  d2.name = pick(SURNAMES) + pick(GIVEN_NAMES_FEMALE);
  return [d1, d2];
}

// ========== 存档系统 ==========

function getSaveKey(slot) { return 'zmnrj_save_' + slot; }
function getSlotsKey() { return 'zmnrj_slots'; }

function saveGame(slot) {
  const data = JSON.parse(JSON.stringify(G));
  data._timestamp = new Date().toISOString();
  data._sectName = G.sectName;
  data._year = G.year;
  data._month = G.month;
  try {
    localStorage.setItem(getSaveKey(slot), JSON.stringify(data));
    updateSaveSlots();
  } catch(e) {
    console.warn('存档失败：', e);
  }
}

function loadGame(slot) {
  try {
    const raw = localStorage.getItem(getSaveKey(slot));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) {
    return null;
  }
}

function deleteSave(slot) {
  localStorage.removeItem(getSaveKey(slot));
  updateSaveSlots();
}

function updateSaveSlots() {
  saveSlots = [];
  for (let i = 0; i < 6; i++) {
    const data = loadGame(i);
    if (data) saveSlots.push({ slot: i, data });
  }
  saveSlots.sort((a, b) => new Date(b.data._timestamp) - new Date(a.data._timestamp));
}

function autoSave() {
  // 轮转存储在槽 0-2（最近三个月）
  const slot = ((G.year - 1) * 12 + G.month) % 3;
  saveGame(slot);
  // 同时在槽 3 存最新进度
  saveGame(3);
}

function exportSave() {
  const data = JSON.parse(JSON.stringify(G));
  data._exportTime = new Date().toISOString();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${G.sectName}_掌门日记_第${G.year}年${G.month}月.json`;
  a.click();
  URL.revokeObjectURL(url);
  addEvent('已导出存档至本地文件。', 'neutral');
}

function importSave(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.sectName || !data.disciples) throw new Error('存档格式不符');
      G = data;
      usedDecisions = [];
      updateSaveSlots();
      autoSave();
      renderGame();
      addEvent('已从外部文件载入存档。掌门，欢迎归来。', 'good');
    } catch(err) {
      alert('存档文件无效，无法读取。');
    }
  };
  reader.readAsText(file);
}

function rollbackToSlot(slot) {
  const data = loadGame(slot);
  if (!data) return;
  if (!confirm(`确定回档至「${data._sectName}」第${data._year}年${data._month}月？当前进度将丢失。`)) return;
  G = data;
  usedDecisions = [];
  delete G._timestamp;
  delete G._sectName;
  delete G._year;
  delete G._month;
  delete G._exportTime;
  autoSave();
  renderGame();
  addEvent('已回档至历史记录。', 'neutral');
}

// ========== 事件系统 ==========

function addEvent(text, mood) {
  G.eventLog.unshift({
    text,
    mood: mood || 'neutral',
    year: G.year,
    month: G.month,
  });
  if (G.eventLog.length > 100) G.eventLog.length = 100;
}

function triggerRandomEvent() {
  // 50% 江湖事件，50% 门中生息
  const pool = Math.random() < 0.5 ? 'jianghu' : 'mensheng';
  const event = pick(EVENT_POOLS[pool]);
  G.pendingEvent = event;
  applyEventEffect(event);
  addEvent(event.text, event.good ? 'good' : 'bad');
  return event;
}

function applyEventEffect(event) {
  const e = event.effect;
  if (e.prestige) G.prestige = clamp(G.prestige + e.prestige, 0, 100);
  if (e.silver) G.silver = Math.max(0, G.silver + e.silver);
  if (e.morale) G.morale = clamp(G.morale + e.morale, 0, 100);
  if (e.injury) G.injury = clamp(G.injury + e.injury, 0, 100);
  if (e.freeRecruit) {
    for (let i = 0; i < e.freeRecruit; i++) {
      G.disciples.push(generateDisciple(10));
    }
    addEvent(`${e.freeRecruit}名江湖人士加入本派！`, 'good');
  }
  if (e.special === 'manual') {
    // 随机学会一门未掌握的武功
    const unlearned = MARTIAL_ARTS.filter(a => !G.martialArtsLearned.includes(a.id));
    if (unlearned.length > 0) {
      const art = pick(unlearned);
      G.martialArtsLearned.push(art.id);
      addEvent(`获得武学残卷，参悟《${art.name}》！`, 'good');
    }
  }
  if (e.special === 'epiphany') {
    G.prestige = clamp(G.prestige + 3, 0, 100);
    // 随机一名弟子内力大增
    const alive = G.disciples.filter(d => d.alive);
    if (alive.length > 0) {
      const d = pick(alive);
      d.innerPower = clamp(d.innerPower + rand(8, 20), 10, 100);
      addEvent(`${d.name}听掌门讲道，若有所悟，内力精进！`, 'good');
    }
  }
  if (e.loyaltyLoss) {
    G.disciples.forEach(d => {
      if (d.alive && Math.random() < 0.3) d.loyalty = clamp(d.loyalty - rand(5, 15), 0, 100);
    });
  }
  if (e.loyaltyChange) {
    G.disciples.forEach(d => {
      if (d.alive) d.loyalty = clamp(d.loyalty + rand(-5, 10), 0, 100);
    });
  }
}

// ========== 月度推进 ==========

function advanceMonth() {
  // 弟子成长
  G.disciples.forEach(d => {
    if (!d.alive) return;
    d.monthsInSect++;
    d.innerPower = clamp(d.innerPower + rand(0, 3) + Math.floor((G.morale / 100) * 2), 10, 100);
    // 忠诚度受门派状态影响
    const loyaltyDelta = Math.floor((G.morale - 50) / 20) + rand(-2, 2);
    d.loyalty = clamp(d.loyalty + loyaltyDelta, 0, 100);
  });

  // 掌门伤势自然恢复
  G.injury = clamp(G.injury - rand(2, 5), 0, 100);

  // 被动收入/支出
  const passiveIncome = Math.floor(G.prestige * 0.3) + G.disciples.filter(d => d.alive).length * 3;
  const passiveExpense = G.disciples.filter(d => d.alive).length * 5 + 20;
  G.silver = Math.max(0, G.silver + passiveIncome - passiveExpense);

  // 志气自然浮动
  G.morale = clamp(G.morale + rand(-3, 3), 0, 100);

  // 低忠诚度弟子叛逃检查
  const beforeCount = G.disciples.filter(d => d.alive).length;
  G.disciples = G.disciples.filter(d => {
    if (!d.alive) return false;
    if (d.loyalty < 15 && Math.random() < 0.25) {
      addEvent(`${d.name}叛出师门，不知所踪！`, 'bad');
      G.morale = clamp(G.morale - 5, 0, 100);
      return false;
    }
    return true;
  });

  // 库银枯竭
  if (G.silver <= 0 && G.disciples.filter(d => d.alive).length > 2) {
    G.morale = clamp(G.morale - 10, 0, 100);
    const leavers = G.disciples.filter(d => d.alive).slice(0, Math.ceil(G.disciples.length / 3));
    leavers.forEach(d => { d.alive = false; });
    G.disciples = G.disciples.filter(d => d.alive);
    addEvent('库银见底，数名弟子辞别而去……', 'bad');
  }

  // 检查游戏结束
  if (G.disciples.filter(d => d.alive).length === 0 && G.silver < 20) {
    G.gameOver = true;
    G.gameOverReason = '门中无弟子，库银枯竭。山门冷落，掌门黯然隐退……';
  }
  if (G.prestige <= 0 && G.morale <= 0) {
    G.gameOver = true;
    G.gameOverReason = '江湖声望尽失，门人志气消沉。本派终究未能撑过难关。';
  }

  // 推进时间
  G.month++;
  if (G.month > 12) {
    G.month = 1;
    G.year++;
  }

  // 重置决策
  usedDecisions = [];
  G.decisionsUsed = 0;
  G.pendingEvent = null;

  // 年份更新
  if (G.month === 1) {
    addEvent(`———— 第${G.year}年 ————`, 'neutral');
  }

  // 自动存档
  if (!G.gameOver) autoSave();
}

// ========== 论剑 ==========

function runTournament() {
  const power = getSectCombatPower();
  // 江湖排名：根据战斗力 + 声望随机化
  const totalSects = 8 + Math.floor(G.year / 2);
  const rankBase = Math.max(1, Math.floor(totalSects * (1 - (power / 200 + G.prestige / 200))));
  const rank = clamp(rankBase + rand(-2, 2), 1, totalSects);

  let rewardSilver = 0;
  let rewardPrestige = 0;
  let descText = '';

  if (rank === 1) {
    rewardSilver = 300;
    rewardPrestige = 15;
    descText = `本派弟子技压群雄，夺得魁首！一时间名动江湖，四方来贺！`;
  } else if (rank <= 3) {
    rewardSilver = 200;
    rewardPrestige = 10;
    descText = `本派位列三甲，战绩斐然。门下弟子扬眉吐气，掌门面上有光。`;
  } else if (rank <= Math.floor(totalSects / 2)) {
    rewardSilver = 100;
    rewardPrestige = 5;
    descText = `本派位列中游，虽未夺魁，亦属不易。弟子们还需勤加修炼。`;
  } else {
    rewardSilver = 30;
    rewardPrestige = 0;
    descText = `本派成绩不佳，位列末流。掌门面上无光，但来日方长，卧薪尝胆便是。`;
    G.morale = clamp(G.morale - 5, 0, 100);
  }

  G.silver += rewardSilver;
  G.prestige = clamp(G.prestige + rewardPrestige, 0, 100);
  G.morale = clamp(G.morale + rand(3, 8), 0, 100);

  // 弟子从论剑中成长
  G.disciples.forEach(d => {
    if (d.alive) d.innerPower = clamp(d.innerPower + rand(2, 6), 10, 100);
  });

  G.tournamentHistory.push({
    year: G.year,
    rank,
    totalSects,
    power,
  });

  return {
    rank,
    totalSects,
    power,
    descText,
    rewardSilver,
    rewardPrestige,
    rankNames: ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'],
  };
}

// ========== UI 渲染 ==========

function renderApp() {
  if (!G) {
    renderStartScreen();
    return;
  }
  if (G.gameOver) {
    renderGameOver();
    return;
  }
  renderGame();
}

function renderStartScreen() {
  const container = document.getElementById('content');
  container.className = 'start-screen fade-in';
  container.innerHTML = `
    <h1>掌 门 日 记</h1>
    <div class="subtitle">武侠门派经营模拟器</div>
    <div class="poem">
      白手起家开山门<br>
      招贤纳士聚英魂<br>
      江湖风云多变幻<br>
      论剑之日定乾坤
    </div>
    <div class="start-input">
      <label>请为山门赐名：</label>
      <input type="text" id="sectNameInput" placeholder="如：青云门" maxlength="10" autocomplete="off">
    </div>
    <div style="margin-top: 1.5rem;">
      <button class="btn btn-primary" onclick="startGame()" style="font-size:1.1rem;padding:0.6rem 2.5rem;">
        开 山 立 派
      </button>
    </div>
    <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--ink-fade);">
      已有存档？<a href="javascript:void(0)" onclick="showLoadScreen()" style="color:var(--cinnabar);">载入进度</a>
    </div>
    <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--ink-fade);">
      <label style="cursor:pointer;color:var(--cinnabar);">
        从文件导入存档
        <input type="file" accept=".json" onchange="importSave(this.files[0])" style="display:none;">
      </label>
    </div>
  `;
  updateSaveSlots();
  // 回车也可开始
  setTimeout(() => {
    const inp = document.getElementById('sectNameInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
    }
  }, 100);
}

function showLoadScreen() {
  updateSaveSlots();
  if (saveSlots.length === 0) {
    alert('尚无存档记录。');
    return;
  }
  const panel = document.getElementById('savePanel');
  const dialog = document.getElementById('saveDialog');
  dialog.innerHTML = `
    <div class="panel-title">载入存档</div>
    <div style="max-height:350px;overflow-y:auto;margin-bottom:1rem;">
      ${saveSlots.map(s => `
        <div class="save-slot" onclick="loadGameAndStart(${s.slot})">
          <div>
            <div class="slot-info">${s.data._sectName || '未命名'} — 第${s.data._year}年第${s.data._month}月</div>
            <div class="slot-time">声望${s.data.prestige} · 库银${s.data.silver}两 · ${s.data.disciples.filter(d=>d.alive).length}名弟子</div>
          </div>
          <button class="btn btn-sm" onclick="event.stopPropagation();deleteSaveSlot(${s.slot})">删除</button>
        </div>
      `).join('')}
    </div>
    <button class="btn" onclick="hideSavePanel()">返回</button>
  `;
  panel.classList.add('show');
}

function deleteSaveSlot(slot) {
  if (!confirm('确定删除此存档？')) return;
  deleteSave(slot);
  showLoadScreen();
}

function loadGameAndStart(slot) {
  const data = loadGame(slot);
  if (!data) return;
  G = data;
  usedDecisions = [];
  delete G._timestamp;
  delete G._sectName;
  delete G._year;
  delete G._month;
  delete G._exportTime;
  hideSavePanel();
  renderGame();
  addEvent('掌门归来，山门依旧。', 'neutral');
}

function hideSavePanel() {
  document.getElementById('savePanel').classList.remove('show');
}

function startGame() {
  const input = document.getElementById('sectNameInput');
  const name = (input ? input.value.trim() : '') || '无名派';
  G = JSON.parse(JSON.stringify(DEFAULT_STATE));
  G.sectName = name;
  G.disciples = generateStartingDisciples();
  G.martialArtsLearned = ['hunyuan'];
  usedDecisions = [];
  addEvent(`掌门于山下立旗，${name}今日开山！门下已有弟子${G.disciples.length}人。`, 'good');
  autoSave();
  renderGame();
}

function renderGameOver() {
  const container = document.getElementById('content');
  container.innerHTML = `
    <div class="start-screen fade-in" style="padding:2rem;">
      <h1 style="font-size:2.2rem;color:var(--cinnabar);">山 门 落 幕</h1>
      <div style="font-size:1.1rem;color:var(--ink-light);margin:1.5rem 0;line-height:2;">
        ${G.sectName}<br>
        第${G.year}年${G.month}月<br><br>
        ${G.gameOverReason}
      </div>
      <div style="color:var(--ink-fade);margin-bottom:1rem;">
        声望：${G.prestige} · 库银：${G.silver}两 · 弟子：${G.disciples.filter(d=>d.alive).length}人
      </div>
      <button class="btn btn-primary" onclick="G=null;renderStartScreen();" style="font-size:1.1rem;padding:0.6rem 2rem;">
        重 头 再 来
      </button>
      <div style="margin-top:1rem;">
        <button class="btn btn-sm" onclick="showSavePanel()">查看存档 / 回档</button>
      </div>
    </div>
  `;
}


function renderGame() {
  const container = document.getElementById('content');
  container.className = 'fade-in';

  const isDecember = G.month === 12;
  const aliveDisciples = G.disciples.filter(d => d.alive);
  const decisionsLeft = G.maxDecisions - usedDecisions.length;

  let html = '';

  // ===== 顶部标题栏 =====
  html += `<div class="top-bar">
    <h1>${G.sectName}<span class="subtitle"> · 掌门日记</span></h1>
    <div class="month-text">
      第 <strong>${G.year}</strong> 年 · <strong>${G.month}</strong> 月
      ${G.injury > 30 ? '<span class="injured-tag">（掌门负伤中）</span>' : ''}
    </div>
  </div>`;

  // ===== 双栏书卷 =====
  html += '<div class="book-layout">';

  // ---- 左页：状态 + 弟子 + 纪事 ----
  html += '<div class="left-page">';

  html += `<div class="stats-grid">
    <div class="stat-card"><div class="label">江湖声望</div><div class="value ${G.prestige>=70?'good':G.prestige<=20?'warn':''}">${G.prestige}</div></div>
    <div class="stat-card"><div class="label">库银</div><div class="value ${G.silver>=200?'gold':G.silver<=30?'warn':''}">${G.silver}两</div></div>
    <div class="stat-card"><div class="label">门人志气</div><div class="value ${G.morale>=70?'good':G.morale<=20?'warn':''}">${G.morale}</div></div>
    <div class="stat-card"><div class="label">掌门伤势</div><div class="value ${G.injury>=50?'warn':G.injury<=10?'good':''}">${G.injury}</div></div>
  </div>`;

  html += `<div class="panel"><div class="panel-title">门下弟子（${aliveDisciples.length}人）</div>`;
  if (aliveDisciples.length === 0) {
    html += '<div style="text-align:center;color:var(--ink-fade);padding:0.5rem;font-size:0.75rem;">山门冷清，尚无弟子。</div>';
  } else {
    html += '<div class="disciple-list">';
    aliveDisciples.forEach(d => {
      const art = MARTIAL_ARTS.find(a => a.id === d.martialArt);
      html += `<div class="disciple-card">
        <div class="disciple-info">
          <span class="disciple-name">${d.name}</span>
          ${d.loyalty < 25 ? '<span style="color:var(--cinnabar);font-size:0.6rem;">（心思浮动）</span>' : ''}
          <span class="disciple-stats">
            资质<strong>${d.talent}</strong>
            内力<strong class="${d.innerPower<20?'stat-low':''}">${d.innerPower}</strong>
            ${art?art.name:'无'}
            忠<strong class="${d.loyalty<25?'stat-low':''}">${d.loyalty}</strong>
          </span>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="panel"><div class="panel-title">门中纪事</div><div class="event-log">';
  if (G.eventLog.length === 0) {
    html += '<div style="color:var(--ink-fade);text-align:center;font-size:0.75rem;">山门初立，尚无纪事。</div>';
  } else {
    G.eventLog.slice(0, 15).forEach(ev => {
      const dateStr = ev.year ? `第${ev.year}年${ev.month}月` : '';
      html += `<div class="event-entry">${dateStr?`<span class="event-month">${dateStr}</span>`:''}<span class="event-${ev.mood}">${ev.text}</span></div>`;
    });
    if (G.eventLog.length > 15) html += '<div style="text-align:center;color:var(--ink-fade);font-size:0.7rem;">…… 仅显示近期纪事 ……</div>';
  }
  html += '</div></div>';

  html += '</div>'; // end left-page

  // ---- 右页：决策 + 论剑 + 武学 ----
  html += '<div class="right-page">';

  if (isDecember) {
    const result = runTournament();
    addEvent(`年终论剑！本派在${result.totalSects}派中位列第${result.rank}名。${result.descText}`, 'good');
    html += `<div class="panel tournament-panel">
      <div class="panel-title">年 终 论 剑</div>
      <div class="rank-display">第 ${result.rankNames[Math.min(result.rank,10)]||result.rank} 名</div>
      <div class="tournament-result">
        天下共 <strong>${result.totalSects}</strong> 派与会 · 本派战力：${result.power}<br>
        ${result.descText}<br>
        <span style="color:var(--gold);">赏银 ${result.rewardSilver} 两</span> · 
        <span style="color:var(--jade);">声望 +${result.rewardPrestige}</span>
      </div>
      <button class="btn btn-primary btn-lg" onclick="advanceAndRender()">辞旧迎新，进入${G.year+1}年</button>
    </div>`;
  }

  if (!isDecember) {
    html += `<div class="panel"><div class="panel-title">本月决策（尚余 ${decisionsLeft} 次）</div>`;
    if (decisionsLeft > 0) {
      html += '<div class="decision-grid">';
      DECISIONS.forEach(dec => {
        const used = usedDecisions.includes(dec.id);
        const available = !used && dec.req();
        const costText = dec.costType === 'silver' ? `花费${fmtSilver(dec.cost)}` : '不耗银两';
        html += `<div class="decision-card ${used?'used':''}"
             ${available?`onclick="executeDecision('${dec.id}')"`:''}
             style="${!available&&!used?'opacity:0.45;cursor:not-allowed;':''}">
          <div class="card-title">${dec.title}</div>
          <div class="card-cost">${costText}</div>
          <div class="card-desc">${dec.desc}</div>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="advance-section">';
    html += `<button class="btn btn-gold btn-lg" onclick="advanceAndRender()" ${usedDecisions.length===0?'disabled':''}>${usedDecisions.length>0?'本月事毕，推进时日 →':'请至少做一项决策'}</button>`;
    if (usedDecisions.length === 0) html += '<div class="advance-hint">点击上方决策卡片处理本月事务</div>';
    html += '</div>';
  }

  html += `<div class="panel"><div class="panel-title">本派武学（${G.martialArtsLearned.length}/${MARTIAL_ARTS.length}）</div><div class="art-tags">`;
  MARTIAL_ARTS.forEach(art => {
    const learned = G.martialArtsLearned.includes(art.id);
    html += `<span class="art-tag${learned?'':' unlearned'}">${art.name}<span style="font-size:0.6rem;color:var(--ink-fade);">(${art.type})</span>${learned?'':' <span class="unlearned-label">未习</span>'}</span>`;
  });
  html += '</div></div>';

  html += '</div>'; // end right-page
  html += '</div>'; // end book-layout

  // ===== 底部操作栏 =====
  html += `<div class="bottom-bar">
    <button class="btn btn-sm" onclick="showSavePanel()">存档管理</button>
    <button class="btn btn-sm" onclick="exportSave()">导出存档</button>
    <button class="btn btn-sm" onclick="autoSave();alert('已保存当前进度。')">快速存档</button>
    <button class="btn btn-sm btn-jade" onclick="confirmNewGame()">重开山门</button>
  </div>`;

  container.innerHTML = html;
}

function showSavePanel() {
  updateSaveSlots();
  const panel = document.getElementById('savePanel');
  const dialog = document.getElementById('saveDialog');
  const currentSlot = ((G.year - 1) * 12 + G.month) % 3;
  dialog.innerHTML = `
    <div class="panel-title">存档管理</div>
    <div style="margin-bottom:0.8rem;font-size:0.85rem;color:var(--ink-fade);">
      当前进度：${G.sectName} — 第${G.year}年${G.month}月
    </div>
    <div style="font-size:0.8rem;color:var(--ink-light);margin-bottom:0.5rem;">📜 自动存档（最近三月）：</div>
    ${[0,1,2].map(i => {
      const data = loadGame(i);
      if (data) {
        return `
          <div class="save-slot" style="${i === currentSlot ? 'border-color:var(--cinnabar);' : ''}">
            <div>
              <div class="slot-info">
                ${i === currentSlot ? '● ' : ''}第${data._year}年${data._month}月
                ${i === currentSlot ? '<span style="color:var(--cinnabar);font-size:0.7rem;">（当前）</span>' : ''}
              </div>
              <div class="slot-time">声望${data.prestige} · 银${data.silver}两 · ${data.disciples.filter(d=>d.alive).length}弟子</div>
            </div>
            <button class="btn btn-sm" onclick="rollbackToSlot(${i})">回档</button>
          </div>
        `;
      }
      return `<div class="save-slot" style="opacity:0.4;"><div class="slot-info">空位</div></div>`;
    }).join('')}
    <div style="margin:1rem 0 0.5rem;font-size:0.8rem;color:var(--ink-light);">💾 手动存档：</div>
    ${[4,5].map(i => {
      const data = loadGame(i);
      if (data) {
        return `
          <div class="save-slot">
            <div>
              <div class="slot-info">存档 ${i-3} — 第${data._year}年${data._month}月</div>
              <div class="slot-time">声望${data.prestige} · 银${data.silver}两 · ${data.disciples.filter(d=>d.alive).length}弟子</div>
            </div>
            <div>
              <button class="btn btn-sm" onclick="rollbackToSlot(${i})">回档</button>
              <button class="btn btn-sm" onclick="deleteSaveSlotFromPanel(${i})">删</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="save-slot" onclick="saveGame(${i});updateSaveSlotsInPanel();" style="cursor:pointer;">
          <div class="slot-info">存档 ${i-3} — 空位（点击存入）</div>
        </div>
      `;
    }).join('')}
    <div style="margin-top:1rem;display:flex;gap:0.5rem;">
      <button class="btn btn-sm" onclick="exportSave();hideSavePanel();">导出 JSON</button>
      <label class="btn btn-sm" style="cursor:pointer;">
        导入存档
        <input type="file" accept=".json" onchange="importSave(this.files[0]);hideSavePanel();" style="display:none;">
      </label>
      <button class="btn btn-sm" onclick="hideSavePanel()" style="margin-left:auto;">关闭</button>
    </div>
  `;
  panel.classList.add('show');
}

function updateSaveSlotsInPanel() {
  updateSaveSlots();
  showSavePanel();
}

function deleteSaveSlotFromPanel(slot) {
  if (!confirm('确定删除此存档？')) return;
  deleteSave(slot);
  showSavePanel();
}

function confirmNewGame() {
  if (confirm('确定重开山门？当前进度将丢失。建议先存档。')) {
    G = null;
    renderStartScreen();
  }
}

function executeDecision(decisionId) {
  if (usedDecisions.includes(decisionId)) return;
  const dec = DECISIONS.find(d => d.id === decisionId);
  if (!dec || !dec.req()) return;
  usedDecisions.push(decisionId);
  G.decisionsUsed++;
  dec.effect();
  if (G.gameOver) {
    renderGameOver();
    return;
  }
  renderGame();
}

function advanceAndRender() {
  // 触发随机事件
  const event = triggerRandomEvent();

  // 推进时间
  advanceMonth();

  if (G.gameOver) {
    renderGameOver();
    return;
  }

  renderGame();
}

// ========== 键盘快捷键 ==========
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') hideSavePanel();
});

// ========== 初始化 ==========
updateSaveSlots();
renderStartScreen();

// 如果有存档，显示提示
if (saveSlots.length > 0) {
  console.log('检测到已有存档，可在开始画面选择载入。');
}
</script>
</body>
</html>
